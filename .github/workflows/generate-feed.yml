name: Generate RSS Feed

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached feed
        id: cache-feed
        uses: actions/cache/restore@v4
        with:
          path: feed.xml
          key: feed-xml-${{ github.run_id }}
          restore-keys: feed-xml-

      - name: Generate RSS feed
        id: generate
        continue-on-error: true
        run: python roigarena_rss.py --once > feed.xml

      - name: Use cached feed on failure
        if: steps.generate.outcome == 'failure'
        run: |
          if [ -f feed.xml ]; then
            echo "Generation failed — using cached feed.xml from previous run"
          else
            echo "Generation failed and no cached feed available"
            exit 1
          fi

      - name: Save feed to cache
        if: steps.generate.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: feed.xml
          key: feed-xml-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
