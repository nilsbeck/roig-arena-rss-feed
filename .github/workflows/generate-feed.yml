name: Generate RSS Feed

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.generate.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached feed
        id: cache-feed
        uses: actions/cache/restore@v4
        with:
          path: feed.xml
          key: feed-xml-${{ github.run_id }}
          restore-keys: feed-xml-

      - name: Generate RSS feed
        id: generate
        continue-on-error: true
        run: |
          set -o pipefail
          # Write to a temp file first so a failed run never clobbers a good feed.
          python roigarena_rss.py --once > feed.xml.tmp
          # Sanity check: the feed must contain at least one item.
          if ! grep -q "<item>" feed.xml.tmp; then
            echo "::error::Generated feed contains no <item> entries"
            exit 1
          fi
          mv feed.xml.tmp feed.xml

      - name: Use cached feed on failure
        if: steps.generate.outcome == 'failure'
        run: |
          rm -f feed.xml.tmp
          if [ -f feed.xml ]; then
            echo "::warning::Generation failed — deploying cached feed.xml from a previous run"
          else
            echo "::error::Generation failed and no cached feed available"
            exit 1
          fi

      - name: Save feed to cache
        if: steps.generate.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: feed.xml
          key: feed-xml-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Mark the whole run as failed (→ GitHub notification) if the feed could not
  # be freshly generated, even though a cached feed was deployed to keep the
  # feed live.
  report-status:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if feed generation did not succeed
        if: needs.build.outputs.generated != 'success'
        run: |
          echo "::error::Feed generation failed; a cached feed was deployed instead. Investigate roigarena_rss.py / the source site."
          exit 1
